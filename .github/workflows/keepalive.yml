name: Keepalive

# GitHub disables scheduled workflows in a public repository after 60 days
# without repository activity. Re-enabling a workflow through the API resets
# that timer, so this runs twice a month and re-enables the scheduled workflows,
# including itself. It makes no commits.
on:
  schedule:
    - cron: "25 5 1,15 * *" # 1st and 15th of each month
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-enable scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for workflow in scan.yml health-check.yml keepalive.yml; do
            gh workflow enable "$workflow"
          done
